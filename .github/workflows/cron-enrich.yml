name: Enrichment cron pinger

# Free Hobby-tier substitute for Vercel Cron. GitHub Actions scheduled workflows
# have a 5-minute minimum interval. Each tick curls /api/cron/enrich which:
#   1. Self-heals orphaned companies (pending contacts but no active job)
#   2. Drains up to 10 jobs per call (each job = 10 contacts of one company)
#
# Auth uses CRON_SECRET stored as a GitHub Actions secret.
# Manual trigger also available via the "Run workflow" button.
#
# Security note: the only ${{ }} expression is secrets.CRON_SECRET, passed via
# env: (the safe pattern). No untrusted user input is interpolated into run:.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/enrich
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set on this repository"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://sbc-gold.vercel.app/api/cron/enrich || printf "\n000")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          case "$status" in
            2*) exit 0 ;;
            401|403) echo "::error::Auth failed — check CRON_SECRET"; exit 1 ;;
            5*) echo "::warning::Upstream $status — will retry next tick"; exit 0 ;;
            *) echo "::warning::Unexpected $status"; exit 0 ;;
          esac
